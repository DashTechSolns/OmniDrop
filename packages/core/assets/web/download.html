<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniDrop</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #090D16;
        --primary: #06B6D4;
        --secondary: #8B5CF6;
        --accent: #10B981;
        --text: var(--accent);
        --muted: var(--secondary);
        --surface: var(--background);
      }

        body {
            font-family: sans-serif, system-ui;
            margin: 0;
            line-height: 1.5;
            text-align: center;
        color: var(--text);
        background: var(--background);
        }

        a {
            text-decoration: none;
        color: var(--text);
        }

      button {
        padding: 0.8em 1em;
        font: inherit;
        font-weight: 600;
        color: var(--background);
        background: var(--primary);
        border: 0;
        border-radius: 5px;
        cursor: pointer;
      }

      button:hover { background: var(--accent); }

      #upload-panel {
        box-sizing: border-box;
        width: min(100% - 2em, 1000px);
        margin: 2em auto;
        padding: 1em;
        text-align: left;
        background: var(--surface);
        border: 1px solid var(--secondary);
        border-radius: 5px;
      }

      #upload-files { display: block; margin: 1em 0; }

      #staged-files { padding-left: 1.2em; color: var(--muted); }

        #file-list {
            box-sizing: border-box;
            width: 100%;
            max-width: 1000px;
            padding: 0 1em;
            margin: 0 auto;
            text-align: left;
        }

        .file-item {
            display: table;
            width: 100%;
            padding: 0.5em 1em;
            background-color: var(--secondary);
            border-radius: 5px;
            margin-bottom: 1em;
            float: left;
            box-sizing: border-box;
        }

        .file-item:hover {
            background-color: var(--primary);
        }

        .file-name-cell, .file-size-cell, .file-index-cell {
            display: table-cell;
            vertical-align: middle;
        }

        .file-name-cell {
            width: 100%;
            padding: 0 0.5em;
        }

        .file-size-cell, .file-index-cell {
            font-size: 0.8em;
            white-space: nowrap;
            color: var(--text);
        }

        /* Two columns layout */
        .file-item {
            width: 100%;
        }

        @media screen and (min-width: 768px) {
            #file-list.file-item {
                width: 48%;
                margin-right: 2%;
            }
            #file-list.file-item:nth-child(2n) {
                margin-right: 0;
            }
        }

        /* Single file mode */

        #single-file {
            box-sizing: border-box;
            width: 100%;
            text-align: left;
            max-width: 400px;
            padding: 0 1em;
            margin: 0 auto;
        }
    </style>
</head>
<body>
<noscript>
    OmniDrop requires JavaScript, which is currently disabled. Please enable it and try again.
</noscript>

  <h1 style="padding: 0.5em">OmniDrop</h1>
  <p>Download shared files or send files to this device.</p>
<p id="status-text"></p>
<div id="file-list"></div>
<div id="single-file"></div>
  <section id="upload-panel">
    <h2>Send files to this device</h2>
    <input id="upload-files" type="file" multiple>
    <ul id="staged-files"></ul>
    <button id="send-upload" type="button" disabled>Send staged files</button>
    <p id="upload-status" role="status"></p>
  </section>

<script>
    // IMPORTANT: This script works in Internet Explorer 8!

    var BASE_URL = '/api/localsend/v2';

    var i18n = {};
    var sessionId = sessionStorage.getItem('sessionId');
    var queryParams = location.search.slice(1).split('&');
    var queryPin = null;
    var stagedFiles = [];

    // Parse query parameters manually for IE
    for (var i = 0; i < queryParams.length; i++) {
      var pair = queryParams[i].split('=');
      if (pair[0] === 'pin') {
        queryPin = decodeURIComponent(pair[1]);
        break;
      }
    }

    function firstRequestFiles() {
      document.getElementById('status-text').innerText = i18n.waiting;
      var initialUrl = BASE_URL + '/prepare-download';

      if (sessionId) {
        initialUrl += '?sessionId=' + encodeURIComponent(sessionId);
        if (queryPin) {
          initialUrl += '&pin=' + encodeURIComponent(queryPin);
        }
      } else if (queryPin) {
        initialUrl += '?pin=' + encodeURIComponent(queryPin);
      }

      makeRequest(initialUrl, 'POST', function (response) {
        if (response.status === 401) {
          pinRequestFiles(true);
          return;
        }

        if (response.status === 403) {
          document.getElementById('status-text').innerText = i18n.rejected;
          return;
        }

        if (response.status === 429) {
          document.getElementById('status-text').innerText = i18n.tooManyAttempts;
          return;
        }

        if (response.status !== 200) {
          document.getElementById('status-text').innerText = 'Error: ' + response.status;
          return;
        }

        handleSuccess(response);
      });
    }

    function pinRequestFiles(firstAttempt) {
      var pin = prompt(i18n.enterPin + (firstAttempt ? '' : '\n' + i18n.invalidPin));
      if (!pin) {
        document.getElementById('status-text').innerText = i18n.invalidPin;
        return;
      }

      makeRequest(BASE_URL + '/prepare-download?pin=' + encodeURIComponent(pin), 'POST', function (response) {
        if (response.status === 401) {
          pinRequestFiles(false);
          return;
        }

        if (response.status === 403) {
          document.getElementById('status-text').innerText = i18n.rejected;
          return;
        }

        if (response.status === 429) {
          document.getElementById('status-text').innerText = i18n.tooManyAttempts;
          return;
        }

        if (response.status !== 200) {
          document.getElementById('status-text').innerText = 'Error: ' + response.status;
          return;
        }

        handleSuccess(response);
      });
    }

    function makeRequest(url, method, callback) {
      var xhr = new XMLHttpRequest();
      xhr.open(method, url, true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
          callback(xhr);
        }
      };
      xhr.send();
    }

    function fetchI18n(then) {
      makeRequest('/i18n.json', 'GET', function (response) {
        if (response.status === 200) {
          i18n = JSON.parse(response.responseText);
          then();
        }
      });
    }

    function init() {
      var uploadInput = document.getElementById('upload-files');
      uploadInput.onchange = function () {
        stagedFiles = Array.prototype.slice.call(uploadInput.files);
        renderStagedFiles();
      };
      document.getElementById('send-upload').onclick = uploadStagedFiles;
      fetchI18n(firstRequestFiles);
    }

    function renderStagedFiles() {
      var list = document.getElementById('staged-files');
      list.innerHTML = '';
      for (var i = 0; i < stagedFiles.length; i++) {
        var row = document.createElement('li');
        row.textContent = stagedFiles[i].name + ' (' + formatBytes(stagedFiles[i].size) + ')';
        list.appendChild(row);
      }
      document.getElementById('send-upload').disabled = stagedFiles.length === 0;
    }

    function uploadStagedFiles() {
      if (!stagedFiles.length) return;
      var selected = {};
      var files = {};
      for (var i = 0; i < stagedFiles.length; i++) {
        var id = String(i);
        selected[id] = stagedFiles[i];
        files[id] = {
          id: id,
          fileName: stagedFiles[i].name,
          size: stagedFiles[i].size,
          fileType: stagedFiles[i].type || 'application/octet-stream'
        };
      }
      var body = JSON.stringify({
        info: {
          alias: 'Web Browser',
          version: '2.1',
          deviceType: 'web',
          fingerprint: getFingerprint(),
          port: 0,
          protocol: location.protocol === 'https:' ? 'https' : 'http',
          download: false
        },
        files: files
      });
      var url = '/api/localsend/v2/prepare-upload';
      if (queryPin) url += '?pin=' + encodeURIComponent(queryPin);
      document.getElementById('upload-status').textContent = i18n.waiting;
      makeUploadRequest(url, 'POST', body, function (response) {
        if (response.status === 401) {
          var pin = prompt(i18n.enterPin);
          if (!pin) return setUploadStatus(i18n.invalidPin);
          makeUploadRequest('/api/localsend/v2/prepare-upload?pin=' + encodeURIComponent(pin), 'POST', body, function (retry) {
            handleUploadResponse(retry, selected);
          });
          return;
        }
        handleUploadResponse(response, selected);
      });
    }

    function handleUploadResponse(response, selected) {
      if (response.status !== 200) return setUploadStatus(errorText(response.status));
      var data = JSON.parse(response.responseText);
      var fileIds = getKeys(data.files);
      uploadNextFile(data.sessionId, data.files, selected, fileIds, 0);
    }

    function uploadNextFile(sessionId, tokens, selected, fileIds, index) {
      if (index >= fileIds.length) {
        stagedFiles = [];
        renderStagedFiles();
        document.getElementById('upload-files').value = '';
        return setUploadStatus('Files sent.');
      }
      var fileId = fileIds[index];
      var url = '/api/localsend/v2/upload?sessionId=' + encodeURIComponent(sessionId) +
          '&fileId=' + encodeURIComponent(fileId) + '&token=' + encodeURIComponent(tokens[fileId]);
      makeUploadRequest(url, 'POST', selected[fileId], function (response) {
        if (response.status !== 200) return setUploadStatus(errorText(response.status));
        uploadNextFile(sessionId, tokens, selected, fileIds, index + 1);
      });
    }

    function makeUploadRequest(url, method, body, callback) {
      var xhr = new XMLHttpRequest();
      xhr.open(method, url, true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) callback(xhr);
      };
      xhr.send(body);
    }

    function setUploadStatus(message) {
      document.getElementById('upload-status').textContent = message;
    }

    function getFingerprint() {
      var fingerprint = sessionStorage.getItem('fingerprint');
      if (!fingerprint) {
        fingerprint = 'web-';
        for (var i = 0; i < 32; i++) fingerprint += Math.floor(Math.random() * 16).toString(16);
        sessionStorage.setItem('fingerprint', fingerprint);
      }
      return fingerprint;
    }

    function errorText(status) {
      return status ? 'Error: ' + status : 'Error';
    }

    function handleSuccess(response) {
      var data = JSON.parse(response.responseText);
      var files = data.files;
      sessionId = data.sessionId;
      sessionStorage.setItem('sessionId', sessionId);

      document.getElementById('status-text').innerText = i18n.files + ' (' + getKeys(data.files).length + ')';

      // Handling file display
      handleFilesDisplay(files, sessionId);
    }

    function handleFilesDisplay(files, sessionId) {
      var html = '';
      var fileKeys = getKeys(files);
      for (var i = 0; i < fileKeys.length; i++) {
        var file = files[fileKeys[i]];
        html += '<a class="file-item" href="' + BASE_URL + '/download?sessionId=' + encodeURIComponent(sessionId) + '&fileId=' + encodeURIComponent(fileKeys[i]) + '">' +
            '<div class="file-index-cell">' + (i + 1) + '</div>' +
            '<div class="file-name-cell">' + escapeHtml(file.fileName) + '</div>' +
            '<div class="file-size-cell">' + formatBytes(file.size) + '</div>' +
            '</a>';
      }

      if (fileKeys.length === 1) {
        document.getElementById('single-file').innerHTML = html;
      } else {
        document.getElementById('file-list').innerHTML = html;
      }
    }

    function escapeHtml(text) {
      if (text === null || text === undefined) {
        return '';
      }
      var map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return String(text).replace(/[&<>"']/g, function (m) { return map[m]; });
    }

    function formatBytes(bytes) {
      if (bytes < 1024) {
        return bytes + ' B';
      } else if (bytes < 1024 * 1024) {
        return (bytes / 1024).toFixed(1) + ' KB';
      } else if (bytes < 1024 * 1024 * 1024) {
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
      } else {
        return (bytes / (1024 * 1024 * 1024)).toFixed(1) + ' GB';
      }
    }

    function getKeys(obj) {
      var keys = [];
      for (var key in obj) {
        keys.push(key);
      }
      return keys;
    }

    init();
</script>
</body>
</html>
